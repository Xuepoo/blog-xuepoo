{% extends "base.html" %} {% block title %}分类与标签 - {{ config.title }}{% endblock title %} {%
block content %}
<section style="margin: 3rem 0">
  <h1>{{ taxonomy.name | capitalize }}</h1>
  <ul
    style="list-style: none; padding: 0; margin: 2rem 0; display: flex; flex-wrap: wrap; gap: 1rem"
  >
    {% for term in terms %}
    <li style="margin-bottom: 0">
      <a
        href="{{ term.permalink | safe }}"
        style="
          display: inline-block;
          padding: 0.35rem 0.85rem;
          border: 1px solid var(--border-color);
          border-radius: 9999px;
          text-decoration: none;
          font-size: 0.9rem;
          font-family: var(--font-sans);
          font-weight: 600;
        "
      >
        {{ term.name }}
        <span style="font-weight: 400; color: var(--text-secondary); margin-left: 0.25rem"
          >({{ term.pages | length }})</span
        >
      </a>
    </li>
    {% else %}
    <li>暂无相关数据。</li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
