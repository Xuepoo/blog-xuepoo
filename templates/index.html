{% extends "base.html" %}

{% block content %}
<div class="blog-posts-grid">
  {% for page in section.pages %}
  <article class="post-card">
    <header>
      <a href="{{ page.permalink }}" class="post-title-link">{{ page.title }}</a>
      <div class="post-meta">发表时间: {{ page.date | date(format="%Y-%m-%d") }}</div>
    </header>
    {% if page.summary %}
    <div class="post-summary">{{ page.summary | safe }}</div>
    {% else %}
    <div class="post-summary">{{ page.description }}</div>
    {% endif %}
  </article>
  {% endfor %}
</div>
{% endblock content %}
