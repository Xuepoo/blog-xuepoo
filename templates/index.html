{% extends "base.html" %} {% block content %}
<div class="zen-post-list">
  {% for page in section.pages %}
  <article class="zen-post-item">
    <h2>
      <a href="{{ page.permalink }}">{{ page.title }}</a>
    </h2>
    <div class="zen-post-meta">
      <time datetime="{{ page.date | date(format='%Y-%m-%d') }}"
        >{{ page.date | date(format="%Y-%m-%d") }}</time
      >
    </div>
    <div class="zen-post-summary">
      {% if page.summary %} {{ page.summary | safe }} {% else %} {{ page.description }} {% endif %}
    </div>
    <div style="margin-top: 1.5rem">
      <a href="{{ page.permalink }}" class="read-more-link">阅读全文 &rarr;</a>
    </div>
  </article>
  {% endfor %}
</div>
{% endblock content %}
