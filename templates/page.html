{% extends "base.html" %}

{% block content %}
<article class="single-article" style="background:#fff; border:var(--border-double); border-radius:6px; padding:1.5rem; box-shadow:var(--panel-shadow);">
  <header class="article-header" style="border-bottom:1px dashed var(--cherry-pink); padding-bottom:0.5rem; margin-bottom:1rem;">
    <h1 class="article-title" style="margin:0; font-family:var(--font-vintage); color:#4a4a4a; font-size:1.8rem;">{{ page.title }}</h1>
    <div class="article-meta" style="font-size:0.8rem; color:var(--vintage-gray); margin-top:0.3rem;">发表时间: {{ page.date | date(format="%Y-%m-%d") }}</div>
  </header>
  <div class="article-body" style="font-family:var(--font-vintage); line-height:1.7; font-size:14px; color:#333;">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
