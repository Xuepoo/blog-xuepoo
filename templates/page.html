{% extends "base.html" %} {% block content %}
<article class="zen-single-post">
  <header>
    <h1>{{ page.title }}</h1>
    <div class="zen-post-meta">
      <time datetime="{{ page.date | date(format='%Y-%m-%d') }}"
        >{{ page.date | date(format="%Y-%m-%d") }}</time
      >
    </div>
  </header>

  <div class="zen-article-body">{{ page.content | safe }}</div>
</article>

<div class="back-to-list">
  <a href="/">&larr; 返回列表</a>
</div>
{% endblock content %}
