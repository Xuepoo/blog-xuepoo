{% extends "base.html" %} {% block content %}
<article class="nes-container is-rounded with-title" style="background: #fff; padding: 1.5rem">
  <p class="title" style="font-size: 1.2rem; font-family: var(--font-pixel-cn)">
    📖 {{ page.title }}
  </p>
  <div
    class="article-meta"
    style="font-size: 0.8rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center"
  >
    <span class="nes-badge" style="display: inline-flex"
      ><span class="is-error" style="font-family: var(--font-pixel-en)"
        >{{ page.date | date(format="%Y-%m-%d") }}</span
      ></span
    >
  </div>
  <div
    class="article-body nes-text"
    style="line-height: 1.8; font-size: 1rem; font-family: var(--font-pixel-cn)"
  >
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
