<!doctype html>
<html lang="{% if lang %}{{ lang }}{% else %}zh{% endif %}">
  <head>
    <script>
      window.errors = [];
      window.addEventListener("error", (e) => {
        window.errors.push(
          e.message + " at " + e.filename + ":" + e.lineno + "\n" + (e.error ? e.error.stack : ""),
        );
      });
      window.addEventListener("unhandledrejection", (e) => {
        window.errors.push(
          "Unhandled Promise Rejection: " +
            e.reason +
            "\n" +
            (e.reason && e.reason.stack ? e.reason.stack : ""),
        );
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{% block description %}{{ config.description }}{% endblock description %}"
    />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/page.css" />
    <link rel="stylesheet" href="/giallo-light.css" />

    <!-- KaTeX Math Rendering Support -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
      onload="
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true },
          ],
          throwOnError: false,
        })
      "
    ></script>

    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body>
    <canvas id="vecto-canvas"></canvas>

    <script id="page-data" type="text/plain">
      {
        "config": {
          "title": {{ config.title | json_encode | safe }},
          "description": {{ config.description | json_encode | safe }},
          "anime_title": {{ config.extra.anime_title | default(value="") | json_encode | safe }},
          "anime_subtitle": {{ config.extra.anime_subtitle | default(value="") | json_encode | safe }}
        },
        "data": {% block page_data %}{}{% endblock %}
      }
    </script>

    <script src="/js/blog-renderer.js?v=1.0.14" defer></script>
  </body>
</html>
