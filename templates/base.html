<!doctype html>
<html lang="{% if lang %}{{ lang }}{% else %}zh{% endif %}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{% block description %}{{ config.description }}{% endblock description %}"
    />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/page.css" />
    <link rel="stylesheet" href="/giallo-light.css" />

    <!-- KaTeX Math Rendering Support -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
      onload="
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true },
          ],
          throwOnError: false,
        })
      "
    ></script>

    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body>
    <div id="reading-progress" class="reading-progress-bar"></div>

    <header class="zen-header">
      <div class="header-container">
        <a href="/"><h1>{{ config.title }}</h1></a>
        <div class="zen-search-wrapper">
          <input
            type="text"
            id="zen-search-input"
            placeholder="搜索文章..."
            aria-label="搜索文章"
          />
          <div id="zen-search-results" class="zen-search-results-dropdown"></div>
        </div>
      </div>
    </header>

    <main class="{% block container_class %}zen-container{% endblock %}">
      {% block content %}{% endblock content %}
    </main>

    <footer class="zen-footer">
      <div class="zen-footer-left">
        &copy; {{ now() | date(format="%Y") }} Xuepoo. Crafted in Zen.
      </div>
      <div class="zen-footer-right">
        <a
          href="https://github.com/Xuepoo"
          aria-label="GitHub"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
        </a>
      </div>
    </footer>

    <script>
      // Scroll reading progress
      document.addEventListener("scroll", () => {
        const progress = document.getElementById("reading-progress");
        if (progress) {
          const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progressWidth = totalHeight > 0 ? (window.pageYOffset / totalHeight) * 100 : 0;
          progress.style.width = progressWidth + "%";
        }
      });

      // Search Database
      window.searchDatabase = [
        {% set posts_section = get_section(path="posts/_index.md") %}
        {% for page in posts_section.pages %}
        {
          title: {{ page.title | json_encode | safe }},
          url: {{ page.permalink | json_encode | safe }},
          date: {{ page.date | date(format='%Y-%m-%d') | json_encode | safe }},
          description: {{ page.description | json_encode | safe }},
          content: {{ page.content | striptags | json_encode | safe }},
          tags: {{ page.taxonomies.tags | default(value=[]) | json_encode | safe }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
      ];

      // Search UI Logic
      const searchInput = document.getElementById("zen-search-input");
      const searchResults = document.getElementById("zen-search-results");

      if (searchInput && searchResults) {
        searchInput.addEventListener("input", (e) => {
          const query = e.target.value.trim().toLowerCase();
          if (!query) {
            searchResults.style.display = "none";
            searchResults.innerHTML = "";
            return;
          }

          const matches = window.searchDatabase.filter(post => {
            const isTagSearch = query.startsWith("#");
            if (isTagSearch) {
              // 专门按标签搜索 (例如 "#linux")
              const tagQuery = query.slice(1);
              return post.tags && post.tags.some(tag => tag.toLowerCase().includes(tagQuery));
            } else {
              // 全局搜索：匹配标题、描述、内容或标签
              const inTags = post.tags && post.tags.some(tag => tag.toLowerCase().includes(query));
              return inTags ||
                     post.title.toLowerCase().includes(query) ||
                     post.description.toLowerCase().includes(query) ||
                     post.content.toLowerCase().includes(query);
            }
          });

          if (matches.length === 0) {
            searchResults.innerHTML = '<div class="zen-search-no-results">未找到匹配文章</div>';
          } else {
            searchResults.innerHTML = matches.map(post => `
              <a href="${post.url}" class="zen-search-item">
                <div class="zen-search-item-title">${post.title}</div>
                <div class="zen-search-item-meta">${post.date}</div>
              </a>
            `).join("");
          }
          searchResults.style.display = "block";
        });

        // Close search when clicking outside
        document.addEventListener("click", (e) => {
          if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
            searchResults.style.display = "none";
          }
        });
      }
    </script>
  </body>
</html>
