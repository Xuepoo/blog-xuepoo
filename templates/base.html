<!doctype html>
<html lang="{% if lang %}{{ lang }}{% else %}zh{% endif %}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{% block description %}{{ config.description }}{% endblock description %}"
    />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/page.css" />
    <link rel="stylesheet" href="/giallo-light.css" />
    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body>
    <header class="zen-header">
      <a href="/"><h1>{{ config.title }}</h1></a>
      <p>保持专注，静心阅读</p>
      <nav class="zen-nav">
        <a href="/">HOME</a>
        <a href="https://xuepoo.xyz">PORTAL</a>
        <a href="https://github.com/Xuepoo">GITHUB</a>
      </nav>
    </header>

    <main class="zen-container">{% block content %}{% endblock content %}</main>

    <footer class="zen-footer">
      <p>&copy; {{ now() | date(format="%Y") }} Xuepoo. Crafted in Zen.</p>
    </footer>
  </body>
</html>
